name = "matchcraft-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bind a KV namespace for rate limiting (optional but recommended)
# Create with: wrangler kv:namespace create RATE_LIMIT_KV
# Then uncomment and fill in the id:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
# RATE_LIMIT_MAX_PER_DAY = "10"

# Set secrets via CLI (never commit real keys):
#   wrangler secret put CLAUDE_API_KEY
